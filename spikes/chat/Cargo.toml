[package]
name = "chat-spike"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "chat-spike"
path = "src/main.rs"

# Throwaway experiment code (spikes/README.md). Only the protocol crate, no
# world/entity/physics graph: this spike measures packets, it does not play.
[dependencies]
azalea-protocol = { path = "../../third_party/azalea/azalea-protocol", default-features = false, features = ["connecting"] }
# azalea-core at the pinned commit imports `bevy_ecs::component::Component` in
# `game_type.rs` unconditionally, so the feature has to be on for it to compile.
azalea-core = { path = "../../third_party/azalea/azalea-core", features = ["bevy_ecs"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["rt", "macros", "sync", "time"] }
uuid = "1.29"
