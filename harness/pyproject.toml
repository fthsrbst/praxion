[project]
name = "praxion-harness"
version = "0.0.0"
description = "Praxion test harness: server control, referee, fixtures, fake world and the server checklist"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
# The only test tool; there is no runtime dependency.
test = ["pytest>=8"]

[tool.pytest.ini_options]
# Run pytest from anywhere and `import praxion_harness` still resolves.
pythonpath = ["."]
testpaths = ["tests"]
# Default run: unit tests only, no server. Run the live tests with `-m server`.
addopts = "-m 'not server and not needs_player'"
markers = [
    "server: requires a real Minecraft server (starts one)",
    "needs_player: requires a logged-in player",
]
# Never let a thread exception or a misnamed test class hide as a warning.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestCollectionWarning",
]
