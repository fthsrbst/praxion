[package]
name = "praxion-decoder"
description = "Framing, decompression and packet decoding for the tee record stream"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "praxion_decoder"
path = "src/lib.rs"

[[bin]]
name = "praxion-decode"
path = "src/bin/praxion-decode.rs"

[dependencies]
praxion-tee = { path = "../tee" }
praxion-world = { path = "../world" }
azalea-buf = { path = "../../../third_party/azalea/azalea-buf" }
azalea-core = { path = "../../../third_party/azalea/azalea-core" }
azalea-protocol = { path = "../../../third_party/azalea/azalea-protocol", default-features = false, features = ["connecting"] }
azalea-registry = { path = "../../../third_party/azalea/azalea-registry" }
flate2 = { version = "1.1.9", features = ["zlib-rs"] }

[dev-dependencies]
azalea-block = { path = "../../../third_party/azalea/azalea-block" }
azalea-entity = { path = "../../../third_party/azalea/azalea-entity" }
azalea-inventory = { path = "../../../third_party/azalea/azalea-inventory" }
azalea-world = { path = "../../../third_party/azalea/azalea-world" }
