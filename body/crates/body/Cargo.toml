[package]
name = "praxion-body"
description = "Demo-0 body process: tee -> decoder -> world -> perception -> reflexes/arbiter/interpreter -> primitives -> actuator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "praxion_body"
path = "src/lib.rs"

[[bin]]
name = "praxion-body"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
log = "0.4"
azalea-protocol = { path = "../../../third_party/azalea/azalea-protocol", default-features = false, features = ["connecting"] }
praxion-arbiter = { path = "../arbiter" }
praxion-decoder = { path = "../decoder" }
praxion-eventlog = { path = "../eventlog" }
praxion-facts = { path = "../facts" }
praxion-headless = { path = "../headless" }
praxion-interpreter = { path = "../interpreter" }
praxion-manifest = { path = "../manifest" }
praxion-perception = { path = "../perception" }
praxion-planner = { path = "../planner" }
praxion-port = { path = "../port" }
praxion-primitives = { path = "../primitives" }
praxion-receipts = { path = "../receipts" }
praxion-reflexes = { path = "../reflexes" }
praxion-rules = { path = "../rules" }
praxion-world = { path = "../world" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
azalea-chat = { path = "../../../third_party/azalea/azalea-chat" }
azalea-registry = { path = "../../../third_party/azalea/azalea-registry" }
uuid = "1.29"
